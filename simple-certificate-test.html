<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Certificate Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        .certificate-container {
            margin: 20px 0;
        }
        .certificate-image {
            max-width: 100%;
            height: auto;
            border: 3px solid #a67c52;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .controls {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 0 5px;
            background-color: #a67c52;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #8a6642;
        }
        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        #image-path {
            font-family: monospace;
            word-break: break-all;
            background-color: #f5f5f5;
            padding: 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple Certificate Test</h1>
        
        <div class="certificate-container">
            <img src="certificates/certificate1.jpg" alt="Certificate" class="certificate-image" id="certificate">
        </div>
        
        <div class="controls">
            <button onclick="prevCertificate()">Previous</button>
            <button onclick="nextCertificate()">Next</button>
        </div>
        
        <div class="status">
            <p><strong>Certificate:</strong> <span id="certificate-number">1</span> of 6</p>
            <p><strong>Path:</strong> <span id="image-path">certificates/certificate1.jpg</span></p>
            <p><strong>Load Status:</strong> <span id="load-status">Loading...</span></p>
        </div>
    </div>
    
    <script>
        // Simple certificate navigation
        let currentIndex = 1;
        const totalCertificates = 6;
        const certificateImg = document.getElementById('certificate');
        const certificateNumber = document.getElementById('certificate-number');
        const imagePath = document.getElementById('image-path');
        const loadStatus = document.getElementById('load-status');
        
        // Set initial load status
        certificateImg.onload = function() {
            loadStatus.textContent = "Successfully loaded";
            loadStatus.style.color = "green";
            console.log("Image loaded successfully:", this.src);
            console.log("Dimensions:", this.naturalWidth, "x", this.naturalHeight);
        };
        
        certificateImg.onerror = function() {
            loadStatus.textContent = "Failed to load";
            loadStatus.style.color = "red";
            console.error("Image failed to load:", this.src);
        };
        
        // Check initial image
        if (certificateImg.complete) {
            if (certificateImg.naturalWidth === 0) {
                loadStatus.textContent = "Failed to load";
                loadStatus.style.color = "red";
            } else {
                loadStatus.textContent = "Successfully loaded";
                loadStatus.style.color = "green";
            }
        }
        
        function updateCertificate() {
            const imgPath = `certificates/certificate${currentIndex}.jpg`;
            certificateImg.src = imgPath;
            certificateNumber.textContent = currentIndex;
            imagePath.textContent = imgPath;
            loadStatus.textContent = "Loading...";
            loadStatus.style.color = "#666";
        }
        
        function nextCertificate() {
            currentIndex = (currentIndex % totalCertificates) + 1;
            updateCertificate();
        }
        
        function prevCertificate() {
            currentIndex = (currentIndex > 1) ? currentIndex - 1 : totalCertificates;
            updateCertificate();
        }
    </script>
</body>
</html>
