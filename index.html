<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="custom-fixes.css">
    <link rel="stylesheet" href="about-me-animation.css">
    <link rel="stylesheet" href="projects-decorations.css">
    <!-- Certificate viewer scripts are disabled and replaced with fix-certificate-viewer.js -->
    <!--<link rel="stylesheet" href="certificate-viewer.css">-->
    <!--<script src="certificate-viewer.js"></script>-->
    <title>Portfolio Website</title>
    <style>
        /* Ensure the certificate fullscreen viewer is hidden by default */
        #certificate-fullscreen-viewer,
        .certificate-fullscreen-viewer,
        #fixed-certificate-viewer,
        #inline-certificate-viewer {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
        }
        
        /* Only show certificate viewers when explicitly made active */
        #certificate-fullscreen-viewer.active,
        .certificate-fullscreen-viewer.active,
        #inline-certificate-viewer[style*="opacity: 1"],
        #fixed-certificate-viewer[style*="opacity: 1"] {
            display: flex !important;
            opacity: 1 !important;
            visibility: visible !important;
        }
        
        /* Standard fullscreen viewer for projects should work normally */
        .fullscreen-viewer {
            display: none;
            opacity: 0;
            visibility: hidden;
            /* Other styles are in style.css */
        }
        
        .fullscreen-viewer.active {
            display: flex;
            opacity: 1;
            visibility: visible;
            /* Other styles are in style.css */
        }

        /* Ensure the fullscreen image is properly styled */
        .fullscreen-image {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            display: block !important;
            margin: 0 auto;
            border-radius: 2px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        
        /* Ensure the fixed certificate viewer is not affected by other styles */
        #fixed-certificate-viewer {
            /* These styles will be applied by the script directly */
        }
    </style>
    
    <!-- Include the certificate viewer fix script at the top -->
    <script src="fix-certificate-viewer.js"></script>
    
    <!-- Add global function for About Me trigger -->
    <script>
        // Track if the user has already clicked the About Me trigger in current session
        let hasClickedAboutMe = false;
        
        function triggerAboutMe(event) {
            event.preventDefault();
            event.stopPropagation();
            console.log('Instagram frame clicked via inline handler!');
            
            const mainContent = document.querySelector('.home-main-content');
            const chatBubble = document.querySelector('.chat-bubble');
            const tapIndicator = document.querySelector('.tap-indicator');
            
            if (mainContent) {
                mainContent.classList.add('about-me-active');
                console.log('Added about-me-active class via inline handler');
                
                // Hide the indicators when the About Me section is active
                if (chatBubble) {
                    chatBubble.classList.add('hidden');
                }
                if (tapIndicator) {
                    tapIndicator.classList.add('hidden');
                }
            } else {
                console.error('Main content element not found in inline handler');
            }
        }
        
        function closeAboutMe(event) {
            event.preventDefault();
            event.stopPropagation();
            console.log('Back button clicked via inline handler!');
            
            const mainContent = document.querySelector('.home-main-content');
            if (mainContent) {
                mainContent.classList.remove('about-me-active');
                console.log('Removed about-me-active class via inline handler');
                
                // Show the indicators again when closing the About Me section
                setTimeout(() => {
                    const chatBubble = document.querySelector('.chat-bubble');
                    const tapIndicator = document.querySelector('.tap-indicator');
                    if (chatBubble) {
                        chatBubble.classList.remove('hidden');
                    }
                    if (tapIndicator) {
                        tapIndicator.classList.remove('hidden');
                    }
                }, 300); // Small delay to ensure the animation completes first
            } else {
                console.error('Main content element not found in inline handler');
            }
        }
        
        // Add document click handler for outside clicks
        document.addEventListener('DOMContentLoaded', function() {
            // No longer check localStorage - we want the indicators to always be visible initially
            
            document.addEventListener('click', function(event) {
                const mainContent = document.querySelector('.home-main-content');
                const instaTrigger = document.getElementById('about-me-trigger');
                
                if (!mainContent || !instaTrigger) return;
                
                // Check if click is inside the insta frame or about-me-expanded-content
                const isClickInside = instaTrigger.contains(event.target) || 
                                     event.target.closest('.about-me-expanded-content');
                
                // If clicking outside and animation is active, close it
                if (!isClickInside && mainContent.classList.contains('about-me-active')) {
                    console.log('Clicked outside, closing expanded content (global handler)');
                    mainContent.classList.remove('about-me-active');
                    
                    // Show the indicators again when closing the About Me section
                    setTimeout(() => {
                        const chatBubble = document.querySelector('.chat-bubble');
                        const tapIndicator = document.querySelector('.tap-indicator');
                        if (chatBubble) {
                            chatBubble.classList.remove('hidden');
                        }
                        if (tapIndicator) {
                            tapIndicator.classList.remove('hidden');
                        }
                    }, 300); // Small delay to ensure the animation completes first
                }
            });
        });
    </script>
</head>
<body>
    <header>
        <a href="#" class="logo">Laira</a>

        <nav>
            <a href="#home-content" class="nav-link active" data-section="home">About Me</a>
            <a href="#education" class="nav-link" data-section="education">Education</a>
            <a href="#projects" class="nav-link" data-section="projects">Projects</a>
            <a href="#certificates" class="nav-link" data-section="certificates">Certificates</a>
        </nav>
    </header>
    
    <!-- Include Home Section -->
    <div id="home-content"></div>
    
    <!-- Include Education Section -->
    <div id="education-content"></div>
    
    <!-- Include Projects Section -->
    <div id="projects-content"></div>

    <!-- Include Certificates Section -->
    <div id="certificates-content"></div>

    <!-- Fullscreen Image Viewer -->
    <div class="fullscreen-viewer">
        <div class="fullscreen-close"><i class="fas fa-times"></i></div>
        <div class="fullscreen-nav prev"><i class="fas fa-chevron-left"></i></div>
        <div class="fullscreen-nav next"><i class="fas fa-chevron-right"></i></div>
        <img src="" alt="" class="fullscreen-image">
        <div class="fullscreen-counter">1 / 10</div>
                </div>

    <script>
        // Certificate viewer functionality has been moved to certificate-viewer.js
        
        // Load components
        fetch('components/home.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('home-content').innerHTML = data;
                // Add event listeners after content is loaded
                setupInstaActions();
                // Set up About Me animation
                setupAboutMeAnimation();
            });

        fetch('components/education.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('education-content').innerHTML = data;
            });
            
        fetch('components/projects.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('projects-content').innerHTML = data;
                // Set up click events for project links after content is loaded
                setupProjectLinks();
                // Set up image gallery after content is loaded
                setupImageGallery();
            });

        // Added direct fetch for certificates section
        fetch('components/certificates.html')
            .then(response => response.text())
            .then(data => {
                console.log('Certificates HTML loaded successfully');
                document.getElementById('certificates-content').innerHTML = data;
                // Certificate viewer is now handled by certificate-viewer.js
            })
            .catch(error => {
                console.error('Error loading certificates:', error);
            });

        // Smooth scroll functionality
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(event) {
                event.preventDefault();
                
                const target = this.getAttribute('href');
                const dataSection = this.getAttribute('data-section');
                
                // Handle home section scrolling
                if (target === '#home-content' || dataSection === 'home') {
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                } else {
                    // For other sections, try to find them by ID
                    let targetElement;
                    
                    // First check if the exact target exists
                    targetElement = document.querySelector(target);
                    
                    // If not found and we have a data-section attribute, try that
                    if (!targetElement && dataSection) {
                        targetElement = document.getElementById(dataSection);
                    }
                    
                    // If still not found, check if it's one of our content divs
                    if (!targetElement && dataSection) {
                        targetElement = document.getElementById(dataSection + '-content');
                    }
                    
                    if (targetElement) {
                        const headerOffset = 80; // Account for header height
                        const elementPosition = targetElement.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                        
                        window.scrollTo({
                            top: offsetPosition,
                            behavior: 'smooth'
                        });
                    } else {
                        console.warn('Target element not found:', target, dataSection);
                    }
                }
                
                // Update active state in nav
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.classList.remove('active');
                });
                this.classList.add('active');
            });
        });
        
        // Update active nav link based on scroll position
        window.addEventListener('scroll', updateActiveNavLink);
        
        function updateActiveNavLink() {
            const sections = {
                home: document.getElementById('home-content'),
                education: document.getElementById('education'),
                projects: document.getElementById('projects'),
                certificates: document.getElementById('certificates')
            };
            
            const scrollPosition = window.scrollY + 100; // Add offset for better detection
            
            // Determine which section is currently in view
            let currentSection = 'home';
            
            // Check certificates, projects, education sections in reverse order (bottom to top)
            if (sections.certificates && scrollPosition >= sections.certificates.offsetTop - 150) {
                currentSection = 'certificates';
            } else if (sections.projects && scrollPosition >= sections.projects.offsetTop - 150) {
                currentSection = 'projects';
            } else if (sections.education && scrollPosition >= sections.education.offsetTop - 150) {
                currentSection = 'education';
            }
            
            // Update active class on nav links
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('data-section') === currentSection) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }
        
        // Setup project links to make entire project clickable
        function setupProjectLinks() {
            // Project link click handler for opening modals
            document.querySelectorAll('.project-link').forEach(link => {
                link.addEventListener('click', function(event) {
                    event.preventDefault();
                    const projectId = this.getAttribute('data-project');
                    if (projectId) {
                        openProjectModal(projectId);
                    }
                });
            });
            
            // Button click handler within project overlays
            document.querySelectorAll('.project-overlay .btn-small').forEach(button => {
                button.addEventListener('click', function(event) {
                    event.preventDefault();
                    const projectItem = this.closest('.project-item');
                    const projectLink = projectItem.querySelector('.project-link');
                    const projectId = projectLink.getAttribute('data-project');
                    if (projectId) {
                        openProjectModal(projectId);
                    }
                });
            });
            
            // Close modal when clicking the X button
            document.querySelectorAll('.modal-close').forEach(closeBtn => {
                closeBtn.addEventListener('click', closeAllModals);
            });
            
            // Close modal when clicking outside the modal content
            document.querySelectorAll('.project-modal').forEach(modal => {
                modal.addEventListener('click', function(event) {
                    if (event.target === this) {
                        closeAllModals();
                    }
                });
            });
            
            // Close modal with escape key
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    closeAllModals();
                    closeFullscreenViewer();
                }
            });
        }
        
        // Open the project modal
        function openProjectModal(projectId) {
            closeAllModals(); // Close any open modals first
            const modal = document.getElementById('modal-' + projectId);
            if (modal) {
                modal.classList.add('active');
                document.body.style.overflow = 'hidden'; // Prevent scrolling
                
                // Animate the modal content in
                setTimeout(() => {
                    const modalContent = modal.querySelector('.modal-content');
                    if (modalContent) {
                        modalContent.style.transform = 'translateY(0)';
                        modalContent.style.opacity = '1';
                    }
                }, 10);
            }
        }
        
        // Close all modals
        function closeAllModals() {
            document.querySelectorAll('.project-modal').forEach(modal => {
                modal.classList.remove('active');
            });
            document.body.style.overflow = ''; // Restore scrolling
        }
        
        // Setup Instagram action animations
        function setupInstaActions() {
            // Get all Instagram action icons after content is loaded
            const heartIcon = document.querySelector('.insta-actions .fa-heart');
            const commentIcon = document.querySelector('.insta-actions .fa-comment');
            const paperPlaneIcon = document.querySelector('.insta-actions .fa-paper-plane');
            
            // Add click events to each icon
            if (heartIcon) {
                heartIcon.addEventListener('click', function() {
                    this.classList.toggle('fa-regular');
                    this.classList.toggle('fa-solid');
                    this.classList.add('liked');
                    // Remove animation class after animation completes
                    setTimeout(() => {
                        this.classList.remove('liked');
                    }, 800);
                });
            }
            
            if (commentIcon) {
                commentIcon.addEventListener('click', function() {
                    this.classList.add('commented');
                    // Remove animation class after animation completes
                    setTimeout(() => {
                        this.classList.remove('commented');
                    }, 600);
                });
            }
            
            if (paperPlaneIcon) {
                paperPlaneIcon.addEventListener('click', function() {
                    this.classList.add('sent');
                    // Remove animation class after animation completes
                    setTimeout(() => {
                        this.classList.remove('sent');
                    }, 1500);
                });
            }
        }
        
        // Setup fullscreen image gallery
        function setupImageGallery() {
            console.log('Setting up image gallery...');
            
            // Fullscreen viewer elements
            const fullscreenViewer = document.querySelector('.fullscreen-viewer');
            const fullscreenImage = document.querySelector('.fullscreen-image');
            const fullscreenClose = document.querySelector('.fullscreen-close');
            const fullscreenPrev = document.querySelector('.fullscreen-nav.prev');
            const fullscreenNext = document.querySelector('.fullscreen-nav.next');
            const fullscreenCounter = document.querySelector('.fullscreen-counter');
            
            console.log('Fullscreen elements found:', {
                viewer: !!fullscreenViewer,
                image: !!fullscreenImage,
                close: !!fullscreenClose,
                prev: !!fullscreenPrev,
                next: !!fullscreenNext,
                counter: !!fullscreenCounter
            });
            
            let currentGalleryImages = [];
            let currentImageIndex = 0;
            
            // Add click event to all gallery images with direct event handling
            function setupImageClicks() {
                const galleryImages = document.querySelectorAll('.modal-main-image img, .modal-secondary-image img, .modal-additional-image img');
                
                console.log('Found gallery images:', galleryImages.length);
                
                // Remove existing event listeners first to avoid duplicates
                galleryImages.forEach(img => {
                    img.removeEventListener('click', handleImageClick);
                    img.addEventListener('click', handleImageClick);
                    img.style.cursor = 'pointer';
                });
                
                console.log('Image click events set up for', galleryImages.length, 'images');
            }
            
            // Image click handler function
            function handleImageClick(e) {
                console.log('Image clicked!', e.target.src);
                e.preventDefault();
                e.stopPropagation();
                
                // Find all images in the current gallery
                const modal = this.closest('.modal-content-wrapper');
                if (!modal) {
                    console.error('Could not find parent modal-content-wrapper');
                    return;
                }
                
                currentGalleryImages = Array.from(modal.querySelectorAll('.modal-main-image img, .modal-secondary-image img, .modal-additional-image img'));
                console.log('Gallery images count:', currentGalleryImages.length);
                
                // Set the current image index
                currentImageIndex = currentGalleryImages.indexOf(this);
                console.log('Current image index:', currentImageIndex);
                
                // Open fullscreen viewer with the current image
                openFullscreenViewer(this.src, currentImageIndex, currentGalleryImages.length);
            }
            
            // Call setup immediately and again after a short delay to ensure all images are loaded
            setupImageClicks();
            setTimeout(setupImageClicks, 500);
            setTimeout(setupImageClicks, 1000);
            setTimeout(setupImageClicks, 2000);
            
            // Directly attach click events to all project modals when they become active
            document.querySelectorAll('.project-modal').forEach(modal => {
                modal.addEventListener('transitionend', function(e) {
                    if (this.classList.contains('active') && e.propertyName === 'opacity') {
                        console.log('Modal transition ended, setting up click events');
                        setTimeout(setupImageClicks, 100);
                    }
                });
            });
            
            // Close fullscreen viewer
            if (fullscreenClose) {
                fullscreenClose.addEventListener('click', function(e) {
                    console.log('Close button clicked');
                    e.preventDefault();
                    e.stopPropagation();
                    closeFullscreenViewer();
                });
            }
            
            // Click outside image to close
            if (fullscreenViewer) {
                fullscreenViewer.addEventListener('click', function(event) {
                    if (event.target === this) {
                        console.log('Clicked outside, closing viewer');
                        closeFullscreenViewer();
                    }
                });
            }
            
            // Previous image
            if (fullscreenPrev) {
                fullscreenPrev.addEventListener('click', function(e) {
                    console.log('Previous button clicked');
                    e.preventDefault();
                    e.stopPropagation();
                    navigateGallery('prev');
                });
            }
            
            // Next image
            if (fullscreenNext) {
                fullscreenNext.addEventListener('click', function(e) {
                    console.log('Next button clicked');
                    e.preventDefault();
                    e.stopPropagation();
                    navigateGallery('next');
                });
            }
            
            // Keyboard navigation
            document.addEventListener('keydown', function(event) {
                if (!fullscreenViewer || !fullscreenViewer.classList.contains('active')) return;
                
                console.log('Key pressed in fullscreen mode:', event.key);
                if (event.key === 'ArrowLeft') {
                    navigateGallery('prev');
                } else if (event.key === 'ArrowRight') {
                    navigateGallery('next');
                } else if (event.key === 'Escape') {
                    closeFullscreenViewer();
                }
            });
            
            // Open fullscreen viewer
            function openFullscreenViewer(src, index, total) {
                console.log('Opening fullscreen viewer with image:', src);
                if (!fullscreenViewer || !fullscreenImage) {
                    console.error('Fullscreen viewer elements not found!');
                    return;
                }
                
                fullscreenImage.src = src;
                updateCounter(index, total);
                fullscreenViewer.classList.add('active');
                document.body.style.overflow = 'hidden'; // Prevent scrolling
                console.log('Fullscreen viewer activated');
            }
            
            // Navigate through gallery
            function navigateGallery(direction) {
                console.log('Navigating gallery:', direction);
                if (currentGalleryImages.length === 0) {
                    console.error('No gallery images found for navigation');
                    return;
                }
                
                if (direction === 'prev') {
                    currentImageIndex = (currentImageIndex === 0) ? currentGalleryImages.length - 1 : currentImageIndex - 1;
                } else {
                    currentImageIndex = (currentImageIndex === currentGalleryImages.length - 1) ? 0 : currentImageIndex + 1;
                }
                
                console.log('New image index:', currentImageIndex);
                
                // Apply a small fade effect during transition
                if (fullscreenImage) {
                    fullscreenImage.style.opacity = '0.5';
                    setTimeout(() => {
                        fullscreenImage.src = currentGalleryImages[currentImageIndex].src;
                        updateCounter(currentImageIndex, currentGalleryImages.length);
                        fullscreenImage.style.opacity = '1';
                    }, 200);
                }
            }
            
            // Update counter text
            function updateCounter(index, total) {
                if (fullscreenCounter) {
                    fullscreenCounter.textContent = `${index + 1} / ${total}`;
                    console.log('Counter updated:', fullscreenCounter.textContent);
                }
            }
        }
        
        // Close fullscreen viewer
        function closeFullscreenViewer() {
            console.log('Closing fullscreen viewer');
            const fullscreenViewer = document.querySelector('.fullscreen-viewer');
            if (fullscreenViewer) {
                fullscreenViewer.classList.remove('active');
                document.body.style.overflow = ''; // Restore scrolling
                console.log('Fullscreen viewer closed');
            } else {
                console.error('Fullscreen viewer element not found for closing');
            }
        }
        
        // Call once on page load to set initial state
        setTimeout(updateActiveNavLink, 500);
        
        // Add direct click handlers to images after a delay
        function addDirectImageClickHandlers() {
            console.log('Adding direct image click handlers');
            document.querySelectorAll('.modal-main-image img, .modal-secondary-image img, .modal-additional-image img').forEach(img => {
                img.addEventListener('click', function(e) {
                    console.log('Direct image click:', this.src);
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // Access the fullscreen viewer and image directly
                    const fullscreenViewer = document.querySelector('.fullscreen-viewer');
                    const fullscreenImage = document.querySelector('.fullscreen-image');
                    const fullscreenCounter = document.querySelector('.fullscreen-counter');
                    
                    if (fullscreenViewer && fullscreenImage) {
                        // Show the image directly
                        fullscreenImage.src = this.src;
                        
                        // Try to set the counter if available
                        if (fullscreenCounter) {
                            const modal = this.closest('.modal-content-wrapper');
                            if (modal) {
                                const allImages = Array.from(modal.querySelectorAll('.modal-main-image img, .modal-secondary-image img, .modal-additional-image img'));
                                const index = allImages.indexOf(this);
                                fullscreenCounter.textContent = `${index + 1} / ${allImages.length}`;
                            }
                        }
                        
                        fullscreenViewer.classList.add('active');
                        document.body.style.overflow = 'hidden';
                        console.log('Fullscreen viewer activated directly');
                    } else {
                        console.error('Fullscreen elements not found in direct handler');
                    }
                });
                img.style.cursor = 'pointer';
            });
        }
        
        // Add a direct event listener to modal opening
        document.addEventListener('click', function(event) {
            const projectLink = event.target.closest('.project-link');
            const btnSmall = event.target.closest('.btn-small');
            
            if (projectLink || btnSmall) {
                console.log('Project link or button clicked, setting up gallery');
                // Delay to ensure modal is open and content is rendered
                setTimeout(() => {
                    setupImageGallery();
                    addDirectImageClickHandlers(); // Add direct handlers too
                }, 500);
            }
        });
        
        // Initialize the image gallery functionality on page load
        setTimeout(() => {
            console.log('Initializing image gallery on page load');
            setupImageGallery();
            addDirectImageClickHandlers(); // Add direct handlers too
        }, 1000);
        
        // Initialize certificate viewer when scrolling to that section
        let certificatesInitialized = false;
        window.addEventListener('scroll', () => {
            const certificatesSection = document.getElementById('certificates');
            const certificatesContent = document.getElementById('certificates-content');
            
            if (!certificatesInitialized && (certificatesSection || certificatesContent)) {
                const section = certificatesSection || certificatesContent;
                const sectionTop = section.getBoundingClientRect().top;
                
                if (sectionTop < window.innerHeight) {
                    // User has scrolled to certificates section
                    console.log('Scroll detected near certificates section, initializing viewer');
                    
                    if (typeof initCertificateViewers === 'function') {
                        try {
                            initCertificateViewers();
                            certificatesInitialized = true;
                            console.log('Certificate viewer initialized on scroll');
                        } catch (err) {
                            console.error('Error initializing certificate viewer on scroll:', err);
                        }
                    } else {
                        console.log('Initialization function not available on scroll');
                    }
                }
            }
        });

        // Add direct click handler for certificate items
        document.addEventListener('click', function(e) {
            // Check if the target is within a certificate item
            const certificateItem = e.target.closest('.certificate-item');
            
            if (certificateItem) {
                console.log('Direct certificate click detected');
                const fullscreenViewer = document.getElementById('certificate-fullscreen-viewer');
                
                if (!fullscreenViewer) {
                    console.error('Certificate viewer not found in direct handler');
                    return;
                }
                
                // Find all certificates
                const allCertificates = Array.from(document.querySelectorAll('.certificate-item'));
                const currentIndex = allCertificates.indexOf(certificateItem);
                
                // Get image element
                const imgSrc = certificateItem.querySelector('img').src;
                const viewerImg = fullscreenViewer.querySelector('img');
                if (viewerImg) viewerImg.src = imgSrc;
                
                // Update counter if available
                const currentCountEl = document.getElementById('current-certificate');
                const totalCountEl = document.getElementById('total-certificates');
                
                if (currentCountEl) currentCountEl.textContent = currentIndex + 1;
                if (totalCountEl) totalCountEl.textContent = allCertificates.length;
                
                // Show the viewer
                fullscreenViewer.classList.add('active');
                fullscreenViewer.style.display = 'flex';
                fullscreenViewer.style.opacity = '1';
                fullscreenViewer.style.visibility = 'visible';
                document.body.style.overflow = 'hidden';
                
                console.log('Certificate viewer activated via direct click');
            }
            
            // Handle direct close button click
            if (e.target.closest('.certificate-fullscreen-viewer .fullscreen-close')) {
                const fullscreenViewer = document.getElementById('certificate-fullscreen-viewer');
                if (fullscreenViewer) {
                    fullscreenViewer.classList.remove('active');
                    fullscreenViewer.style.opacity = '0';
                    fullscreenViewer.style.visibility = 'hidden';
                    document.body.style.overflow = '';
                    console.log('Certificate viewer closed via direct click');
                }
            }
        });

        // Check if fullscreen viewer elements exist, re-create if missing
        setTimeout(() => {
            console.log('Checking fullscreen viewer elements');
            
            let fullscreenViewer = document.querySelector('.fullscreen-viewer');

                    viewer.style.visibility = 'hidden';
                    document.body.style.overflow = '';
                } else if (e.key === 'ArrowLeft' && prevButton) {
                    prevButton.click();
                } else if (e.key === 'ArrowRight' && nextButton) {
                    nextButton.click();
                }
            });
            
            // Also set up when project modals are opened
            document.querySelectorAll('.project-link, .btn-small').forEach(link => {
                link.addEventListener('click', function() {
                    // Wait for modal to open
                    setTimeout(setupDirectGalleryClicks, 500);
                });
            });
            
        }, 1000);

        // Add direct click handler for modal images as soon as they appear
        document.addEventListener('DOMNodeInserted', function(event) {
            // Check if the inserted node is a modal image or contains modal images
            if (event.target.nodeType === 1) { // Element node
                // Look for modal images within the inserted element
                const modalImages = event.target.querySelectorAll && 
                                   event.target.querySelectorAll('.modal-main-image img, .modal-secondary-image img, .modal-additional-image img');
                
                if (modalImages && modalImages.length) {
                    console.log('📸 Found', modalImages.length, 'new modal images, setting up click handlers');
                    
                    // Set up click handlers for each image
                    modalImages.forEach(img => {
                        // Ensure the image is styled for visibility
                        img.style.cursor = 'pointer';
                        img.style.display = 'block';
                        img.style.maxWidth = '100%';
                        img.style.height = 'auto';
                        
                        // Add click handler
                        img.onclick = function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            
                            console.log('📸 Direct image click:', this.src);
                            
                            // Find all images in the same modal
                            const modal = this.closest('.modal-content-wrapper');
                            if (!modal) {
                                console.error('📸 Modal wrapper not found');
                                return;
                            }
                            
                            const allImages = Array.from(modal.querySelectorAll('.modal-main-image img, .modal-secondary-image img, .modal-additional-image img'));
                            const index = allImages.indexOf(this);
                            
                            console.log('📸 Clicked image index:', index, 'of', allImages.length);
                            
                            // Get the viewer and image
                            const viewer = document.querySelector('.fullscreen-viewer');
                            const image = document.querySelector('.fullscreen-image');
                            const counter = document.querySelector('.fullscreen-counter');
                            
                            if (!viewer || !image) {
                                console.error('📸 Viewer elements not found');
                                return;
                            }
                            
                            // Clear image source first, then set it (forces reload)
                            image.src = '';
                            setTimeout(() => {
                                image.src = this.src;
                                
                                // Update the counter
                                if (counter) {
                                    counter.textContent = `${index + 1} / ${allImages.length}`;
                                }
                                
                                // Show the viewer with forced styles
                                viewer.style.display = 'flex';
                                viewer.style.justifyContent = 'center';
                                viewer.style.alignItems = 'center';
                                viewer.style.opacity = '1';
                                viewer.style.visibility = 'visible';
                                viewer.classList.add('active');
                                
                                // Store references for navigation
                                window.currentGalleryImages = allImages;
                                window.currentGalleryIndex = index;
                                
                                // Lock body scroll
                                document.body.style.overflow = 'hidden';
                                
                                console.log('📸 Fullscreen viewer activated with image', index + 1, 'of', allImages.length);
                            }, 50);
                        };
                    });
                }
            }
        });

        // Add About Me Animation setup
        function setupAboutMeAnimation() {
            console.log('Setting up About Me animation');
            
            // Wait a short time to ensure elements are fully loaded
            setTimeout(() => {
                const instaTrigger = document.getElementById('about-me-trigger');
                const mainContent = document.querySelector('.home-main-content');
                const backButton = document.querySelector('.about-me-expanded-content .back-button');
                const chatBubble = document.querySelector('.chat-bubble');
                const tapIndicator = document.querySelector('.tap-indicator');
                
                console.log('Elements found:', {
                    instaTrigger: !!instaTrigger,
                    mainContent: !!mainContent,
                    backButton: !!backButton,
                    chatBubble: !!chatBubble,
                    tapIndicator: !!tapIndicator
                });
                
                // Check if user has previously clicked, hide chat bubble and tap indicator if so
                if (chatBubble && hasClickedAboutMe) {
                    chatBubble.classList.add('hidden');
                    tapIndicator.classList.add('hidden');
                }
                
                if (instaTrigger && mainContent) {
                    console.log('Adding click event to Instagram frame');
                    
                    // Remove any existing click handlers to avoid duplicates
                    instaTrigger.removeEventListener('click', handleInstaClick);
                    
                    // Add click handler
                    instaTrigger.addEventListener('click', handleInstaClick);
                    
                    // Function to handle clicks on the Instagram frame
                    function handleInstaClick(e) {
                        console.log('Instagram frame clicked!');
                        e.preventDefault();
                        e.stopPropagation();
                        
                        // Apply the animation class to the main content
                        mainContent.classList.add('about-me-active');
                        console.log('Added about-me-active class to mainContent:', mainContent);
                        console.log('Current classes on mainContent:', mainContent.className);
                        
                        // Hide the chat bubble and tap indicator and mark as clicked
                        if (chatBubble && !hasClickedAboutMe) {
                            chatBubble.classList.add('hidden');
                            tapIndicator.classList.add('hidden');
                            hasClickedAboutMe = true;
                            
                            // Store in localStorage
                            try {
                                localStorage.setItem('hasClickedAboutMe', 'true');
                            } catch (e) {
                                console.log('Unable to save click state', e);
                            }
                        }
                    }
                    
                    // Add back button functionality
                    if (backButton) {
                        console.log('Adding click event to back button');
                        
                        // Remove any existing click handlers to avoid duplicates
                        backButton.removeEventListener('click', handleBackClick);
                        
                        // Add click handler
                        backButton.addEventListener('click', handleBackClick);
                        
                        // Function to handle clicks on the back button
                        function handleBackClick(e) {
                            console.log('Back button clicked!');
                            e.preventDefault();
                            e.stopPropagation();
                            
                            // Remove the animation class
                            mainContent.classList.remove('about-me-active');
                            console.log('Removed about-me-active class from mainContent');
                        }
                    }
                    
                    // Add click outside to close
                    document.removeEventListener('click', handleOutsideClick);
                    document.addEventListener('click', handleOutsideClick);
                    
                    function handleOutsideClick(event) {
                        // Check if click is inside the trigger or expanded content
                        const isClickInside = instaTrigger.contains(event.target) || 
                                             event.target.closest('.about-me-expanded-content');
                        
                        // If clicking outside and animation is active, close it
                        if (!isClickInside && mainContent.classList.contains('about-me-active')) {
                            console.log('Clicked outside, closing expanded content');
                            mainContent.classList.remove('about-me-active');
                        }
                    }
                } else {
                    console.error('Required elements for About Me animation not found!');
                    console.log('DOM structure:', document.body.innerHTML);
                }
            }, 500); // Short delay to ensure elements are loaded
        }
    </script>
</body>
